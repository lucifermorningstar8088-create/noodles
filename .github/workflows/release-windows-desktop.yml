name: Windows Desktop Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Build Windows x64 desktop package and small setup EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install app and desktop build dependencies
        run: uv sync --extra desktop

      - name: Build desktop application
        shell: pwsh
        run: |
          uv run pyinstaller --noconfirm --clean --windowed --onedir --name Noodles `
            --collect-all webview `
            --collect-all clr_loader `
            --collect-all pythonnet `
            --collect-all proxy_tools `
            --collect-submodules noodles `
            src/noodles/desktop.py

      - name: Package desktop files and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/Noodles/* -DestinationPath dist/release/noodles-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/release/noodles-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  noodles-windows-x64.zip" | Set-Content -Encoding ascii dist/release/noodles-windows-x64.zip.sha256

      - name: Compile small Windows bootstrapper
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $compiler)) { throw "The .NET Framework C# compiler was not found." }
          & $compiler /nologo /target:winexe /optimize+ /out:dist/release/NoodlesSetup.exe `
            /reference:System.dll `
            /reference:System.Core.dll `
            /reference:System.Net.Http.dll `
            /reference:System.Windows.Forms.dll `
            /reference:System.Drawing.dll `
            /reference:System.Web.Extensions.dll `
            /reference:System.IO.Compression.dll `
            /reference:System.IO.Compression.FileSystem.dll `
            /reference:Microsoft.CSharp.dll `
            installer/Bootstrapper.cs
          if ($LASTEXITCODE -ne 0) { throw "Bootstrapper compilation failed with exit code $LASTEXITCODE." }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noodles-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: noodles-windows-x64
          path: dist/release

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Noodles ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/release/NoodlesSetup.exe
            dist/release/noodles-windows-x64.zip
            dist/release/noodles-windows-x64.zip.sha256
